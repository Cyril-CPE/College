<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Protest+Riot&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <title>tester</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-pink">
  <main class="container">
    <div id="stage-1" class="stage">
      <h1 class="survey-title">Prototype Test Website</h1>
      <p class="survey-subtitle">Click below to proceed to the Home Page.</p>
      <button type="button" id="start-btn" class="btn btn--primary">Take me</button>
    </div>

    <div id="stage-2" class="stage hidden">
      <img class="cat-img" src="img/cat-0.jpg" alt="Picture of a cat" />
      <p class="title">Hello Angelica. You caught my attention recently, Can I have the chance in getting to know you more?</p>
      <div class="buttons">
        <button type="button" class="btn btn--yes" id="yes-btn">Yes!</button>
        <button type="button" class="btn btn--no" id="no-btn">No :(</button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="script.js?v=18"></script>
</body>
</html>
