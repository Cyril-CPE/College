 <!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Protest+Riot&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Survey</title>
   <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  </head>
  <body>
  <main id="survey-step" class="container">
    <h2>Quick Manhwa Recommendation Survey 📖</h2>
    <p class="subtitle">Help us curate better recommendations!</p>
    
    <form id="manhwa-form">
      <div class="question">
        <p>1. How often do you read Manhwa / Webtoons?</p>
        <div class="rating-group">
          <label><input type="radio" name="q1" value="1" required> 1 (Rarely)</label>
          <label><input type="radio" name="q1" value="2"> 2</label>
          <label><input type="radio" name="q1" value="3"> 3</label>
          <label><input type="radio" name="q1" value="4"> 4</label>
          <label><input type="radio" name="q1" value="5"> 5 (Daily)</label>
        </div>
      </div>

      <div class="question">
        <p>2. How would you rate Romance / Slice of Life manhwas?</p>
        <div class="rating-group">
          <label><input type="radio" name="q2" value="1" required> 1 (Meh)</label>
          <label><input type="radio" name="q2" value="2"> 2</label>
          <label><input type="radio" name="q2" value="3"> 3</label>
          <label><input type="radio" name="q2" value="4"> 4</label>
          <label><input type="radio" name="q2" value="5"> 5 (Masterpiece)</label>
        </div>
      </div>

      <button type="submit" class="submit-btn">Submit Survey</button>
    </form>
  </main>

  
  <main id="secret-step" class="container hidden">
    <img class="cat-img" src="img/cat-0.jpg" alt="Picture of a cat" />
    <p class="title">Hello Angelica. You caught my attention recently, Can I have the chance in getting to know you more?</p>
    <div class="buttons">
      <button type="button" class="btn btn--yes">Yes!</button>
      <button type="button" class="btn btn--no">No :( </button>
    </div>
  </main>
   <script src="script.js?v=11"></script>
